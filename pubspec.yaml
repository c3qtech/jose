name: jose
description: Javascript Object Signing and Encryption (JOSE) library supporting JWE, JWS, JWK and JWT
version: 0.3.4
homepage: https://github.com/appsup-dart/jose
funding:
 - https://github.com/sponsors/rbellens


environment:
  sdk: ^3.0.0

dependencies:
  crypto_keys:
    git:
      url: https://github.com/c3qtech/crypto_keys.git
      ref: master
  meta: ^1.1.6
  typed_data: ^1.0.0
  x509:
   git:
      url: https://github.com/c3qtech/x509.git
      ref: master  
  http: '>=0.13.0 <2.0.0'
  http_parser: ^4.0.0
  asn1lib: ^1.0.0
  collection: ^1.15.0

dev_dependencies:
  test: ^1.24.4
  lints: ^2.1.1

false_secrets:
  - test/pem/*
  - example/*.key
